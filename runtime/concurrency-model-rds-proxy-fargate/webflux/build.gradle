// 条件 webflux-r2dbc / webflux-blocking。切り替えは呼ぶエンドポイントだけで、jar は共通。
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // db / bounded 条件。spring-data-r2dbc は使わず、DatabaseClient を持つ spring-r2dbc だけにしている。
    // RSS を比較する検証なので、リポジトリ機構のぶんクラスを増やしたくない
    //
    // spring-boot-r2dbc が必要なのは Boot 4 が自動設定をモジュールに分割したため。
    // これがないと ConnectionFactory の自動設定が入らず、コンパイルは通るのに起動時に
    // No qualifying bean of type 'io.r2dbc.spi.ConnectionFactory' で落ちる
    implementation 'org.springframework.boot:spring-boot-r2dbc'
    implementation 'org.springframework:spring-r2dbc'
    implementation 'io.r2dbc:r2dbc-pool'
    runtimeOnly 'io.asyncer:r2dbc-mysql:1.3.2'

    // blocking 条件。イベントループ上で意図的にブロックするために必要
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j:9.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
