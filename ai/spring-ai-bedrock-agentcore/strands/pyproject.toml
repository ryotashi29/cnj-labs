[project]
name = "outing-agent"
version = "0.1.0"
description = "犬連れのお出かけ先を提案するエージェント（Strands Agents 版。AgentCore Runtime で動かす）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # トレース（LLM・ツールの呼び出しの span）を CloudWatch に送る ADOT の自動計装
    "aws-opentelemetry-distro",
    "bedrock-agentcore",
    "mcp",
    "pydantic",
    "strands-agents",
]

[project.scripts]
outing-agent = "outing_agent.app:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outing_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
