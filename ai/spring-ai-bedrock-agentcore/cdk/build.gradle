plugins {
    id 'java'
    id 'application'
}

group = 'com.ryotashi29.cnj.ai'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.274.0'
    implementation 'software.constructs:constructs:10.8.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.ryotashi29.cnj.ai.agentcore.cdk.CdkApp'
}

tasks.named('test') {
    useJUnitPlatform()
}
