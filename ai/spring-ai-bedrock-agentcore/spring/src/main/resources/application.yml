spring:
  application:
    name: spring-ai-bedrock-agentcore-spring
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-1}
      converse:
        chat:
          # 日本国内の推論プロファイル（jp.）。データが国外に出ない。Strands 版と同じモデル
          model: ${BEDROCK_MODEL_ID:jp.anthropic.claude-haiku-5-5}
          max-tokens: 2000

server:
  # AgentCore Runtime の決まりで、ポートは 8080
  port: 8080

app:
  gateway:
    # AgentCore Gateway の MCP の口。CDK が環境変数で渡す
    url: ${GATEWAY_URL:}
    target-name: geocoding
    tool-name: resolve_place_coordinates

# /ping を actuator の health と連動させる
management:
  tracing:
    sampling:
      # Spring Boot のデフォルトは 10%。検証なのですべて残す（ADOT の拡張も 100% にしている）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
