plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ryotashi29.cnj.ai'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.1')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // Bedrock の Converse API を ChatClient として使う。ツール呼び出し（@Tool）もこの経路で動く
    implementation 'org.springframework.ai:spring-ai-starter-model-bedrock-converse'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Nominatim を呼ぶ RestClient。Boot 4 では starter-web から外れたので個別に足す
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    // Spring AI のメトリクス（トークン数・応答時間）を /actuator/metrics で見るため
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
